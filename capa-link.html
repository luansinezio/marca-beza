<!doctype html><html><head><meta charset="utf-8">
<!--
Capa de link da Beza (og:image), quadrada, 1200x1200: a prévia que aparece quando um link
da casa (reunioes.beza.media, propostas.beza.media) é colado no WhatsApp.
Padrão fechado em 28/out/2026 no onboarding do Rei das Carretilhas. Regras em marca/design-guide.md, "Capa de link".
Parâmetros na URL, todos opcionais:
  tipo     etiqueta lilás da pílula (ex.: Onboarding, Apresentação de identidade, Proposta)
  data     lado vazado da pílula (ex.: Out 2026)
  cliente  nome grande; "|" quebra a linha
  linha    frase curta embaixo do nome
  para     nome de quem recebe, na pílula de baixo ("Para ...")
Gerar o arquivo: scripts/capa-link/gerar.sh
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=block">
<style>
html,body{margin:0;background:#0A0A10}
.capa{width:1200px;height:1200px;position:relative;overflow:hidden;color:#ECEDF6;
 font-family:'IBM Plex Sans',system-ui,sans-serif;
 background:
  radial-gradient(ellipse 62% 52% at 50% 46%,rgba(154,155,229,.13) 0%,rgba(154,155,229,.04) 45%,transparent 72%),
  radial-gradient(ellipse 80% 70% at 50% 45%,#1b1a26 0%,#0f0f16 55%,#0A0A10 100%)}
.capa::before{content:"";position:absolute;inset:0;
 background-image:linear-gradient(rgba(236,237,246,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(236,237,246,.035) 1px,transparent 1px);
 background-size:60px 60px;background-position:-1px -1px}
/* o board: moldura fina com os quatro cantos marcados */
.board{position:absolute;inset:84px;border:1px solid rgba(154,155,229,.20);border-radius:6px}
.board i{position:absolute;width:12px;height:12px;border-radius:50%;background:#9A9BE5;box-shadow:0 0 18px rgba(154,155,229,.55)}
.board i:nth-child(1){top:-6px;left:-6px}.board i:nth-child(2){top:-6px;right:-6px}
.board i:nth-child(3){bottom:-6px;left:-6px}.board i:nth-child(4){bottom:-6px;right:-6px}
.miolo{position:absolute;inset:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 60px 90px;box-sizing:border-box}
.pilula{display:inline-flex;align-items:stretch;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:26px;letter-spacing:.14em;text-transform:uppercase;
 border:1.5px solid rgba(154,155,229,.38);border-radius:12px;overflow:hidden}
.pilula b{background:#9A9BE5;color:#0A0A10;padding:16px 26px;font-weight:600}
.pilula span{color:#9A9BE5;padding:16px 26px}
.pilula span:empty{display:none}
.nome{margin:64px 0 0;font-weight:500;font-size:176px;line-height:.98;letter-spacing:-.03em;white-space:nowrap;
 background:linear-gradient(180deg,#FFFFFF 0%,#E4E5F0 42%,#A9AABF 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 padding-bottom:.06em}
.linha{margin:46px 0 0;font-size:44px;line-height:1.25;color:#8B8DA1;max-width:900px}
.linha:empty{display:none}
.para{margin:52px 0 0;display:inline-flex;gap:14px;align-items:baseline;font-size:32px;color:#8B8DA1;
 border:1.5px solid rgba(236,237,246,.16);border-radius:999px;padding:16px 34px;background:rgba(10,10,16,.5)}
.para strong{color:#9A9BE5;font-weight:600}
.para.vazio{display:none}
.rodape{position:absolute;left:0;right:0;bottom:136px;display:flex;justify-content:center}
.logo{width:210px;display:block;color:#ECEDF6;opacity:.85}
</style></head><body>
<div class="capa">
 <div class="board"><i></i><i></i><i></i><i></i></div>
 <div class="miolo">
  <div class="pilula"><b class="tipo">Onboarding</b><span class="data">Out 2026</span></div>
  <div class="nome">O Rei das<br>Carretilhas</div>
  <div class="linha"></div>
  <div class="para vazio">Para <strong></strong></div>
 </div>

<script>
(function(){
 var q=new URLSearchParams(location.search),$=function(s){return document.querySelector(s)};
 if(q.has('tipo'))$('.tipo').textContent=q.get('tipo');
 if(q.has('data'))$('.data').textContent=q.get('data');
 if(q.has('linha'))$('.linha').textContent=q.get('linha');
 if(q.get('para')){$('.para strong').textContent=q.get('para');$('.para').classList.remove('vazio')}
 var nome=$('.nome');
 if(q.get('cliente')){
  nome.textContent='';
  q.get('cliente').split('|').map(function(t){return t.trim()}).filter(Boolean).forEach(function(t,i){
   if(i)nome.appendChild(document.createElement('br'));nome.appendChild(document.createTextNode(t))});
 }
 document.title='Capa de link · '+nome.textContent;
 // nome comprido encolhe até caber em 900px de largura
 var cabe=function(){var s=176;nome.style.fontSize=s+'px';while(nome.scrollWidth>900&&s>70){s-=2;nome.style.fontSize=s+'px'}};
 cabe();(document.fonts&&document.fonts.ready||Promise.resolve()).then(cabe);
})();
</script>
