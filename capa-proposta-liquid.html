<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beza — Capa de Proposta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    --roxo: #9A9BE5;
    --light: #ECEDF6;
    --muted: #8B8DA1;
    background: #0A0A10;
    background-image:
      linear-gradient(rgba(199,201,214,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(199,201,214,0.04) 1px, transparent 1px);
    background-size: 80px 80px;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* linhas de moldura: topo e rodape, 10% de opacidade */
  .hudrow {
    position: fixed; left: 0; right: 0;
    padding: 0 48px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(236,237,246,0.10);
    user-select: none; pointer-events: none;
  }
  .hudrow.top { top: 40px; }
  .hudrow.bottom { bottom: 40px; }
  .hudrow .mid { position: absolute; left: 50%; transform: translateX(-50%); }

  #stage {
    width: min(88vw, 1620px);
    position: relative;
    z-index: 2;
  }
  canvas#gl { display: block; width: 100%; height: auto; }

  #tag {
    position: absolute; left: 50%;
    /* REGRA DA CAPA: a pill nunca encosta no logo.
       --band-top é a fração da altura do canvas que sobra ACIMA da caixa
       do logo, escrita pelo heightmap em tempo de render. Ancorar nela e
       empurrar a pill inteira pra cima (-100%) mantém ela fora do desenho
       em qualquer largura, em vez de depender de % chutada. */
    top: calc(var(--band-top, 15.2%) - var(--capa-gap, 22px));
    transform: translate(-50%, -100%);
    display: inline-flex; align-items: center;
    border-radius: 11px;
    border: 1px solid rgba(154,155,229,0.55);
    font-family: 'Archivo', 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 21px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    line-height: 1;
    white-space: nowrap; z-index: 3;
  }
  /* segmento cheio: pill propria, mais alta, sobrepondo a moldura */
  #tag .fill {
    background: var(--roxo); color: #0A0A10;
    padding: 15px 22px 13px;
    margin: -4px 0 -4px -1px;
    border-radius: 13px;
    position: relative; z-index: 1;
  }
  #tag .line { color: var(--roxo); padding: 12px 21px 10px; }

  #cliente {
    position: absolute; left: 50%;
    /* mesma regra, espelhada: o rodapé da caixa do logo é 100% - band-top */
    top: calc(100% - var(--band-top, 15.2%) + var(--capa-gap, 22px));
    transform: translate(-50%, 0);
    display: inline-flex; align-items: center; gap: 8px;
    border: 1.5px solid rgba(154,155,229,0.55);
    border-radius: 999px; padding: 13px 34px;
    font-size: 21px; line-height: 1.2; color: var(--muted);
    background: rgba(10,10,16,0.72);
    white-space: nowrap; z-index: 3;
  }
  #cliente b { color: var(--roxo); font-weight: 600; }

  #err { position: fixed; bottom: 8px; left: 8px; color: #F34D4D; font-size: 12px; display: none; }

  @media (max-width: 700px) {
    #stage { width: 90vw; --capa-gap: 12px; }
    .hudrow { padding: 0 20px; letter-spacing: 0.14em; font-size: 9px; }
    .hudrow .mid { display: none; }
    /* as pills são nowrap: em tela estreita precisam encolher junto, senão
       vazam pelas duas bordas. Padding em em pra escalar com a fonte. */
    #tag {
      font-size: min(12px, 3.3vw); letter-spacing: 0.1em;
      max-width: calc(100% - 16px);
    }
    #tag .fill { padding: 0.92em 1.17em 0.75em; margin: -0.25em 0 -0.25em -1px; border-radius: 10px; }
    #tag .line { padding: 0.75em 1.08em 0.58em; }
    #cliente {
      font-size: min(13px, 3.5vw); padding: 0.7em 1.4em; border-width: 1px;
      max-width: calc(100% - 16px);
    }
  }
</style>
</head>
<body>

<div class="hudrow top"><span>Beza Media</span><span class="mid nome-cliente-hud">Nome do Cliente</span><span>Proposta</span></div>
<div class="hudrow bottom"><span>Beza Media</span><span class="mid nome-cliente-hud">Nome do Cliente</span><span>Proposta</span></div>

<div id="stage">
  <canvas id="gl"></canvas>
  <div id="tag"><span class="fill">Proposta comercial</span><span class="line">Válida por 7 dias</span></div>
  <div id="cliente">Cliente: <b id="cliente-nome">Patrícia Gonçalves</b></div>
</div>

<div id="err"></div>

<script>
'use strict';

/* ============================================================
   Réplica local do shader "Logo Gradient" (Framer) com o logo
   da Beza. Duas passadas WebGL2:
   1. buffer "push" (ping-pong, meia resolução, rgba16f) que
      acumula a velocidade do cursor como campo fluido
   2. passada principal: heightmap do logo + turbulência +
      paleta OKLab, deslocada pelo campo do push
   ============================================================ */

// Paleta Beza (design guide): mapeada na mesma rampa
// escuro -> lilás de marca -> lilás profundo -> off-white
const CONFIG = {
  colors: [
    [46/255,  46/255,  92/255 ],   // lilás escuro profundo
    [154/255, 155/255, 229/255],   // #9A9BE5 lilás de marca
    [123/255, 121/255, 201/255],   // #7B79C9 lilás profundo
    [236/255, 237/255, 246/255],   // #ECEDF6 off-white lilás
  ],
  colorBack: [0, 0, 0, 0],
  // base: instância do hero do site de referência (speed lá era 0.59,
  // subido aqui porque a animação idle ficava imperceptível no nosso logo)

  scale: 1.53, seed: 6, speed: 1.5,
  turbAmp: 0.16, turbFreq: 0.9, turbIter: 4, waveFreq: 2.1,
  mousePersist: 0.8, mousePush: 0.5, mouseRadius: 1.0, mouseStretch: 0.1,
  mouseGain: 1.0,   // multiplica a velocidade do cursor antes do depósito
  pushResolutionScale: 0.5,
  heightmapWidth: 2048,
  heightmapPad: 0.10,     // respiro em volta do logo (fração da largura)
  heightmapBlur: 16,      // px de blur pro campo de profundidade
};

// overrides via query string pra afinar sem editar: ?mouseGain=4&speed=0
for (const [k, v] of new URLSearchParams(location.search)) {
  if (k in CONFIG && typeof CONFIG[k] === 'number' && !isNaN(parseFloat(v))) {
    CONFIG[k] = parseFloat(v);
  }
}

const VERT = `#version 300 es
precision highp float;
layout(location = 0) in vec2 a_pos;
out vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);

// Passada 1: campo fluido do mouse (ping-pong)
const PUSH_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;

uniform sampler2D u_push_buffer;
uniform vec2  u_resolution;
uniform float u_deltaTime;
uniform vec4  u_mousePosition;   // xy = pos uv, zw = velocidade uv/frame
uniform float u_mouseHover;
uniform float u_mousePersist;
uniform float u_mousePush;
uniform float u_mouseRadius;
uniform float u_mouseStretch;

void main() {
    float aspect = u_resolution.x / u_resolution.y;
    vec2 aspectFix = vec2(aspect, 1.0);

    vec2 texel = 1.0 / u_resolution;

    vec4 prev = texture(u_push_buffer, v_uv);
    vec2 c  = prev.xy;
    vec2 nl = texture(u_push_buffer, v_uv - vec2(texel.x, 0.0)).xy;
    vec2 nr = texture(u_push_buffer, v_uv + vec2(texel.x, 0.0)).xy;
    vec2 nd = texture(u_push_buffer, v_uv - vec2(0.0, texel.y)).xy;
    vec2 nu = texture(u_push_buffer, v_uv + vec2(0.0, texel.y)).xy;

    vec2 blurred = (nl + nr + nd + nu) * 0.25;
    vec2 field = mix(c, blurred, 0.12);

    float r = clamp(u_deltaTime * 60.0, 0.0, 3.0);
    float decay = pow(mix(0.86, 0.985, clamp(u_mousePersist, 0.0, 1.0)), r);
    field *= decay;

    vec2 rawVel = u_mousePosition.zw * aspectFix * u_mouseHover;
    float smoothK = 1.0 - pow(0.75, r);
    vec2 mouseVel = mix(prev.zw, rawVel, smoothK);

    float speed    = length(mouseVel);
    float brush    = max(u_mouseRadius * 0.1, 0.001);

    float speedPerSec = speed / max(u_deltaTime, 1e-4);
    float moving      = 1.0 - exp(-speedPerSec * 0.5);

    vec2 dir       = speed > 1e-5 ? mouseVel / speed : vec2(1.0, 0.0);
    vec2 ortho     = vec2(-dir.y, dir.x);

    vec2 toMouse   = (v_uv - u_mousePosition.xy) * aspectFix;

    float along    = dot(toMouse, dir);
    float across   = dot(toMouse, ortho);
    float ra       = brush * (1.0 + u_mouseStretch * moving);
    float rb       = brush;
    float d2       = (along * along) / (ra * ra) + (across * across) / (rb * rb);
    float falloff  = exp(-d2);

    field += mouseVel * falloff * (u_mousePush * 0.1) * u_mouseHover;

    field = clamp(field, -1.0, 1.0);

    fragColor = vec4(field, mouseVel);
}`;

// Passada 2: o metal líquido em cima do heightmap do logo
const MAIN_FRAG = `#version 300 es
precision highp float;
in vec2 v_uv;
out vec4 fragColor;

uniform sampler2D u_image_heightmap;
uniform sampler2D u_push_buffer;
uniform vec2  u_resolution;
uniform float u_time;
uniform float u_pixelRatio;

uniform vec4  u_colors[8];
uniform int   u_colors_length;
uniform vec4  u_colorBack;
uniform float u_angle;
uniform float u_bend;
uniform float u_contour;
uniform float u_motionMode;
uniform float u_scale;
uniform float u_seed;
uniform float u_speed;
uniform float u_turbAmp;
uniform float u_turbFreq;
uniform float u_turbIter;
uniform float u_waveFreq;

const float GOLDEN_ANGLE = 2.3999632;
const float TAU = 6.28318530;

uvec3 hash3(uvec3 v) {
    v = v * 1664525u + 1013904223u;
    v.x += v.y * v.z;
    v.y += v.z * v.x;
    v.z += v.x * v.y;
    v ^= v >> 16u;
    v.x += v.y * v.z;
    v.y += v.z * v.x;
    v.z += v.x * v.y;
    return v;
}

vec3 seedRandom(float seedVal) {
    uvec3 s = uvec3(
        floatBitsToUint(seedVal),
        floatBitsToUint(seedVal * 1.5 + 7.31),
        floatBitsToUint(seedVal * 2.7 + 13.37)
    );
    s = hash3(s);
    return vec3(s) / float(0xFFFFFFFFu);
}

vec3 toLinear(vec3 c) { return pow(c, vec3(2.2)); }
vec3 toSrgb(vec3 c) { return pow(clamp(c, 0.0, 1.0), vec3(0.4545)); }

vec3 linearToOklab(vec3 c) {
    float l = 0.4122214708 * c.r + 0.5363325363 * c.g + 0.0514459929 * c.b;
    float m = 0.2119034982 * c.r + 0.6806995451 * c.g + 0.1073969566 * c.b;
    float s = 0.0883024619 * c.r + 0.2817188376 * c.g + 0.6299787005 * c.b;
    l = pow(max(l, 0.0), 1.0 / 3.0);
    m = pow(max(m, 0.0), 1.0 / 3.0);
    s = pow(max(s, 0.0), 1.0 / 3.0);
    return vec3(
        0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
        1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
        0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s
    );
}

vec3 oklabToLinear(vec3 c) {
    float l = c.x + 0.3963377774 * c.y + 0.2158037573 * c.z;
    float m = c.x - 0.1055613458 * c.y - 0.0638541728 * c.z;
    float s = c.x - 0.0894841775 * c.y - 1.2914855480 * c.z;
    l = l * l * l;
    m = m * m * m;
    s = s * s * s;
    return vec3(
        +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
        -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
        -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
    );
}

vec3 oklabToLch(vec3 lab) { return vec3(lab.x, length(lab.yz), atan(lab.z, lab.y)); }
vec3 lchToOklab(vec3 lch) { return vec3(lch.x, lch.y * cos(lch.z), lch.y * sin(lch.z)); }

vec3 mixLch(vec3 lab0, vec3 lab1, float t) {
    vec3 lch0 = oklabToLch(lab0);
    vec3 lch1 = oklabToLch(lab1);
    if (lch0.y < 0.05) lch0.z = lch1.z;
    if (lch1.y < 0.05) lch1.z = lch0.z;
    float dh = lch1.z - lch0.z;
    if (dh > 3.14159265) dh -= 6.28318530;
    if (dh < -3.14159265) dh += 6.28318530;
    return lchToOklab(vec3(
        mix(lch0.x, lch1.x, t),
        mix(lch0.y, lch1.y, t),
        lch0.z + dh * t
    ));
}

vec3 getColor(int idx) {
    if (u_colors_length < 1) return vec3(0.0);
    int safeIdx = clamp(idx, 0, u_colors_length - 1);
    return u_colors[safeIdx].rgb;
}

vec3 paletteN(float t, int count) {
    if (count < 1) return vec3(0.0);
    if (count < 2) return toLinear(getColor(0));
    float segmentSize = 1.0 / float(count - 1);
    t = clamp(t, 0.0, 1.0);
    int idx = min(int(floor(t / segmentSize)), count - 2);
    float localT = clamp((t - float(idx) * segmentSize) / segmentSize, 0.0, 1.0);
    vec3 lab0 = linearToOklab(toLinear(getColor(idx)));
    vec3 lab1 = linearToOklab(toLinear(getColor(idx + 1)));
    return oklabToLinear(mixLch(lab0, lab1, localT));
}

vec3 softGamutMap(vec3 linearRgb) {
    float maxC = max(linearRgb.r, max(linearRgb.g, linearRgb.b));
    float minC = min(linearRgb.r, min(linearRgb.g, linearRgb.b));
    if (minC >= 0.0 && maxC <= 1.0) return linearRgb;
    vec3 lab = linearToOklab(max(linearRgb, 0.0));
    float L = clamp(lab.x, 0.0, 1.0);
    float C = length(lab.yz);
    float h = atan(lab.z, lab.y);
    float maxChroma = 0.4 * (1.0 - pow(abs(2.0 * L - 1.0), 2.0));
    if (C > maxChroma * 0.7) {
        float knee = maxChroma * 0.7;
        C = knee + (maxChroma - knee) * tanh((C - knee) / (maxChroma - knee + 0.001));
    }
    return clamp(oklabToLinear(vec3(L, C * cos(h), C * sin(h))), 0.0, 1.0);
}

float blurDepth3x3(vec2 uv, vec2 dudx, vec2 dudy, vec2 texel, float radius) {
    vec2 r = radius * texel;
    float sum = 4.0 * textureGrad(u_image_heightmap, uv, dudx, dudy).r;
    sum += 2.0 * textureGrad(u_image_heightmap, uv + vec2(0.0, -r.y), dudx, dudy).r;
    sum += 2.0 * textureGrad(u_image_heightmap, uv + vec2(0.0,  r.y), dudx, dudy).r;
    sum += 2.0 * textureGrad(u_image_heightmap, uv + vec2(-r.x, 0.0), dudx, dudy).r;
    sum += 2.0 * textureGrad(u_image_heightmap, uv + vec2( r.x, 0.0), dudx, dudy).r;
    sum += textureGrad(u_image_heightmap, uv + vec2(-r.x, -r.y), dudx, dudy).r;
    sum += textureGrad(u_image_heightmap, uv + vec2( r.x, -r.y), dudx, dudy).r;
    sum += textureGrad(u_image_heightmap, uv + vec2(-r.x,  r.y), dudx, dudy).r;
    sum += textureGrad(u_image_heightmap, uv + vec2( r.x,  r.y), dudx, dudy).r;
    return sum / 16.0;
}

vec2 heightGrad(vec2 uv, vec2 dudx, vec2 dudy, vec2 texel, float blurRadius) {
    float eps = 4.0;
    float dR = blurDepth3x3(uv + vec2(eps * texel.x, 0.0), dudx, dudy, texel, blurRadius);
    float dL = blurDepth3x3(uv - vec2(eps * texel.x, 0.0), dudx, dudy, texel, blurRadius);
    float dU = blurDepth3x3(uv + vec2(0.0, eps * texel.y), dudx, dudy, texel, blurRadius);
    float dD = blurDepth3x3(uv - vec2(0.0, eps * texel.y), dudx, dudy, texel, blurRadius);
    return vec2(dR - dL, dU - dD) / (2.0 * eps * texel);
}

void main() {
    vec2 uv = vec2(v_uv.x, 1.0 - v_uv.y);
    vec2 texSize = vec2(textureSize(u_image_heightmap, 0));
    float imgAspect = texSize.x / texSize.y;
    float canvasAspect = u_resolution.x / u_resolution.y;

    if (canvasAspect > imgAspect) {
        uv.x = (uv.x - 0.5) * (canvasAspect / imgAspect) + 0.5;
    } else {
        uv.y = (uv.y - 0.5) * (imgAspect / canvasAspect) + 0.5;
    }

    vec2 dudx = dFdx(uv);
    vec2 dudy = dFdy(uv);

    vec4 hm = textureGrad(u_image_heightmap, uv, dudx, dudy);
    float fw_b = 0.5 * fwidth(hm.b);
    float hardMask = smoothstep(0.5 - fw_b, 0.5 + fw_b, hm.b);
    float opacity = hardMask * (1.0 - hm.g);

    float edgeDist;
    if (canvasAspect > imgAspect) {
        edgeDist = min(uv.x, 1.0 - uv.x);
    } else if (canvasAspect < imgAspect) {
        edgeDist = min(uv.y, 1.0 - uv.y);
    } else {
        edgeDist = 1.0;
    }
    opacity *= smoothstep(0.0, 1.0 * fwidth(edgeDist), edgeDist);

    if (opacity < 0.001) {
        fragColor = vec4(u_colorBack.rgb * u_colorBack.a, u_colorBack.a);
        return;
    }

    vec2 texel = 1.0 / texSize;
    int colorCount = u_colors_length;

    if (colorCount < 1) {
        fragColor = vec4(u_colorBack.rgb * u_colorBack.a, u_colorBack.a);
        return;
    }

    float rawDepth = blurDepth3x3(uv, dudx, dudy, texel, 6.0);
    float depth = max(rawDepth, 0.001);

    vec2 grad = heightGrad(uv, dudx, dudy, texel, 6.0);
    float gradMag = min(length(grad), 5.0);
    vec2 gradDir = gradMag > 0.001 ? normalize(grad) : vec2(0.0);
    vec2 contourDir = vec2(-gradDir.y, gradDir.x);

    float t = mod(u_time * u_speed, 3600.0);
    float isMelt = step(0.5, u_motionMode);

    vec3 seedOffset = seedRandom(u_seed);
    vec3 seedOffset2 = seedRandom(u_seed + 100.0);
    float seedAngle = u_seed * GOLDEN_ANGLE;
    vec2 seedPhase = (seedOffset2.xy - 0.5) * TAU;

    vec2 p = (uv - 0.5) * 2.0;
    p.x *= imgAspect;

    float cs = cos(seedAngle);
    float sn = sin(seedAngle);
    p = mat2(cs, -sn, sn, cs) * p;

    float ang = u_angle * 3.14159 / 180.0;
    float cosA = cos(ang);
    float sinA = sin(ang);
    p = vec2(p.x * cosA - p.y * sinA, p.x * sinA + p.y * cosA);

    // === MOUSE PUSH (campo fluido do buffer) ===
    vec2 pf = texture(u_push_buffer, v_uv).xy;
    pf.y = -pf.y;
    if (canvasAspect <= imgAspect) {
        pf *= imgAspect / canvasAspect;
    }
    pf = mat2(cs, -sn, sn, cs) * pf;
    pf = vec2(pf.x * cosA - pf.y * sinA, pf.x * sinA + pf.y * cosA);
    p -= pf * 2.0;

    float tTurb = t * mix(1.0, 0.4, isMelt);
    vec2 meltOffset = vec2(1.0, 0.0) * t * 0.4 * isMelt;

    // === DEFORMAÇÃO GUIADA PELA FORMA ===
    float edgeProximity = 1.0 - smoothstep(0.0, 0.8, depth);

    float coordScale = max(0.4, 0.1 + depth * 1.0);
    p *= coordScale;

    p += contourDir * edgeProximity * u_bend * 2.0;
    p -= gradDir * edgeProximity * u_bend * 0.5;
    p *= max(0.5, mix(1.0, 0.4 + 0.6 * smoothstep(0.0, 0.5, depth), u_contour));

    // === TURBULÊNCIA ===
    int turbIter = int(u_turbIter);
    float freq = 1.0 / max(u_turbFreq, 0.01);

    vec2 q = p * u_scale + meltOffset;

    float a = seedPhase.x;
    float d = seedPhase.y;

    for (int j = 2; j < 10; j++) {
        if (j >= turbIter) break;
        float fj = float(j);
        q += u_turbAmp * sin(length(q) / freq * fj + tTurb + vec2(a, d) + seedOffset.xy * fj) / fj;
        a += cos(fj + d * 1.2 + q.x * 2.0 - tTurb + seedOffset2.z);
        d += sin(fj * q.y + a + seedOffset.z + tTurb + seedOffset2.y);
    }

    float base = length(q.yx + vec2(a, d) * 0.2) * u_waveFreq + seedOffset.x;
    float val = 0.5 + 0.125 * sin(base + 1.0) + 0.25 * sin(base + 4.0) + 0.125 * sin(base + 9.0);
    val = clamp((val - 0.3) / 0.4, 0.0, 1.0);

    float innerIntensity = smoothstep(0.0, 0.4, depth);
    float contourHeat = (1.0 - innerIntensity) * u_contour;
    val = mix(val, val * innerIntensity + contourHeat, 0.5 + 0.5 * u_contour);

    vec3 col = paletteN(val, colorCount);
    col = softGamutMap(col);
    col = toSrgb(col);

    col *= opacity;
    vec3 bgColor = u_colorBack.rgb * u_colorBack.a;
    col = col + bgColor * (1.0 - opacity);
    float finalAlpha = opacity + u_colorBack.a * (1.0 - opacity);

    fragColor = vec4(col, finalAlpha);
}`;

// ---------- Heightmap: rasteriza o SVG e monta os canais ----------
// R = profundidade (alpha borrado remapeado), G = 0, B = máscara nítida

function buildHeightmap(img) {
  const pad = CONFIG.heightmapPad;
  const W = CONFIG.heightmapWidth;
  const logoW = W * (1 - pad * 2);
  const logoH = logoW * (img.height / img.width);
  const H = Math.round(logoH + W * pad * 1.2);

  const sharp = document.createElement('canvas');
  sharp.width = W; sharp.height = H;
  const sctx = sharp.getContext('2d');
  const x = (W - logoW) / 2, y = (H - logoH) / 2;
  sctx.drawImage(img, x, y, logoW, logoH);

  const blur = document.createElement('canvas');
  blur.width = W; blur.height = H;
  const bctx = blur.getContext('2d');
  bctx.filter = `blur(${CONFIG.heightmapBlur}px)`;
  bctx.drawImage(sharp, 0, 0);

  const sd = sctx.getImageData(0, 0, W, H).data;
  const bd = bctx.getImageData(0, 0, W, H).data;
  const out = new Uint8ClampedArray(W * H * 4);

  for (let i = 0; i < W * H; i++) {
    const sa = sd[i * 4 + 3] / 255;
    const ba = bd[i * 4 + 3] / 255;
    // profundidade: 0 na borda da letra, 1 no miolo do traço
    const depth = Math.min(1, Math.max(0, (ba - 0.42) / 0.5));
    out[i * 4 + 0] = depth * 255;
    out[i * 4 + 1] = 0;
    out[i * 4 + 2] = sa * 255;
    out[i * 4 + 3] = 255;
  }
  const logoTop = (H - logoH) / 2;
  return { data: new ImageData(out, W, H), width: W, height: H, bandTop: logoTop / H };
}

// ---------- WebGL harness ----------

function fail(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
  throw new Error(msg);
}

function compile(gl, type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    fail('Erro de shader: ' + gl.getShaderInfoLog(sh));
  }
  return sh;
}

function program(gl, fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    fail('Erro de link: ' + gl.getProgramInfoLog(p));
  }
  return p;
}

function start(heightmap) {
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false });
  if (!gl) fail('WebGL2 indisponível nesse navegador.');

  const floatExt = gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float');
  const pushEnabled = !!floatExt;

  // geometria: triângulo fullscreen
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // textura do heightmap
  const hmTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, hmTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, heightmap.data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  // textura zero pro caso do push estar indisponível
  const zeroTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, zeroTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0]));

  const pushProg = program(gl, PUSH_FRAG);
  const mainProg = program(gl, MAIN_FRAG);

  const U = (prog, name) => gl.getUniformLocation(prog, name);

  // ping-pong do buffer push
  let pushA = null, pushB = null, fboA = null, fboB = null;
  let pushW = 0, pushH = 0;

  function makePushTex(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fbo };
  }

  function allocPush() {
    if (!pushEnabled) return;
    pushW = Math.max(2, Math.floor(canvas.width * CONFIG.pushResolutionScale));
    pushH = Math.max(2, Math.floor(canvas.height * CONFIG.pushResolutionScale));
    for (const t of [pushA, pushB]) {
      if (t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); }
    }
    pushA = makePushTex(pushW, pushH);
    pushB = makePushTex(pushW, pushH);
    gl.bindFramebuffer(gl.FRAMEBUFFER, pushA.fbo);
    const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (status !== gl.FRAMEBUFFER_COMPLETE) {
      console.warn('push FBO incompleto, interacao de mouse desativada:', status);
      pushA = pushB = null;
    }
  }

  // sonda de depuracao: varre o buffer push inteiro e acha o pico do campo
  window.__dbg = () => {
    if (!pushA) return { pushEnabled, max: null };
    gl.bindFramebuffer(gl.FRAMEBUFFER, pushA.fbo);
    const px = new Float32Array(pushW * pushH * 4);
    gl.readPixels(0, 0, pushW, pushH, gl.RGBA, gl.FLOAT, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    let maxF = 0, maxV = 0, fx = 0, fy = 0;
    for (let i = 0; i < pushW * pushH; i++) {
      const f = Math.hypot(px[i * 4], px[i * 4 + 1]);
      const v = Math.hypot(px[i * 4 + 2], px[i * 4 + 3]);
      if (f > maxF) { maxF = f; fx = (i % pushW) / pushW; fy = Math.floor(i / pushW) / pushH; }
      if (v > maxV) maxV = v;
    }
    return { pushEnabled, maxField: maxF, at: [fx, fy], maxVel: maxV, mouse: { ...mouse } };
  };

  // tamanho do canvas segue o container, aspecto segue o heightmap
  const stage = document.getElementById('stage');
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = stage.clientWidth;
    const cssH = cssW * (heightmap.height / heightmap.width);
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    allocPush();
  }
  new ResizeObserver(resize).observe(stage);
  resize();
  stage.style.setProperty('--band-top', (heightmap.bandTop * 100).toFixed(2) + '%');

  // mouse em uv (y pra cima), velocidade por frame
  const mouse = { x: 0.5, y: 0.5, px: 0.5, py: 0.5, vx: 0, vy: 0, hover: 0, has: false };
  window.addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    const nx = (e.clientX - r.left) / r.width;
    const ny = 1 - (e.clientY - r.top) / r.height;
    if (!mouse.has) { mouse.px = nx; mouse.py = ny; mouse.has = true; }
    mouse.x = nx; mouse.y = ny;
    mouse.hover = (nx >= -0.05 && nx <= 1.05 && ny >= -0.05 && ny <= 1.05) ? 1 : 0;
  });
  window.addEventListener('pointerleave', () => { mouse.hover = 0; });

  let last = performance.now();
  const t0 = last;

  function frame(now) {
    const dt = Math.min(Math.max((now - last) / 1000, 0.0001), 0.1);
    last = now;
    const time = (now - t0) / 1000;

    // velocidade em uv por segundo (unidade que o runtime do Framer usa)
    mouse.vx = (mouse.x - mouse.px) / dt;
    mouse.vy = (mouse.y - mouse.py) / dt;
    mouse.px = mouse.x;
    mouse.py = mouse.y;

    // passada 1: push (ping-pong)
    if (pushA) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, pushB.fbo);
      gl.viewport(0, 0, pushW, pushH);
      gl.useProgram(pushProg);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, pushA.tex);
      gl.uniform1i(U(pushProg, 'u_push_buffer'), 0);
      gl.uniform2f(U(pushProg, 'u_resolution'), pushW, pushH);
      gl.uniform1f(U(pushProg, 'u_deltaTime'), dt);
      gl.uniform4f(U(pushProg, 'u_mousePosition'), mouse.x, mouse.y,
        mouse.vx * CONFIG.mouseGain, mouse.vy * CONFIG.mouseGain);
      gl.uniform1f(U(pushProg, 'u_mouseHover'), mouse.hover);
      gl.uniform1f(U(pushProg, 'u_mousePersist'), CONFIG.mousePersist);
      gl.uniform1f(U(pushProg, 'u_mousePush'), CONFIG.mousePush);
      gl.uniform1f(U(pushProg, 'u_mouseRadius'), CONFIG.mouseRadius);
      gl.uniform1f(U(pushProg, 'u_mouseStretch'), CONFIG.mouseStretch);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      const tmp = pushA; pushA = pushB; pushB = tmp;
    }

    // passada 2: principal
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(mainProg);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, hmTex);
    gl.uniform1i(U(mainProg, 'u_image_heightmap'), 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, pushA ? pushA.tex : zeroTex);
    gl.uniform1i(U(mainProg, 'u_push_buffer'), 1);

    gl.uniform2f(U(mainProg, 'u_resolution'), canvas.width, canvas.height);
    gl.uniform1f(U(mainProg, 'u_time'), time);
    gl.uniform1f(U(mainProg, 'u_pixelRatio'), Math.min(window.devicePixelRatio || 1, 2));

    const flat = new Float32Array(8 * 4);
    CONFIG.colors.forEach((c, i) => { flat.set([c[0], c[1], c[2], 1], i * 4); });
    gl.uniform4fv(U(mainProg, 'u_colors'), flat);
    gl.uniform1i(U(mainProg, 'u_colors_length'), CONFIG.colors.length);
    gl.uniform4fv(U(mainProg, 'u_colorBack'), CONFIG.colorBack);

    gl.uniform1f(U(mainProg, 'u_angle'), CONFIG.angle);
    gl.uniform1f(U(mainProg, 'u_bend'), CONFIG.bend);
    gl.uniform1f(U(mainProg, 'u_contour'), CONFIG.contour);
    gl.uniform1f(U(mainProg, 'u_motionMode'), CONFIG.motionMode);
    gl.uniform1f(U(mainProg, 'u_scale'), CONFIG.scale);
    gl.uniform1f(U(mainProg, 'u_seed'), CONFIG.seed);
    gl.uniform1f(U(mainProg, 'u_speed'), CONFIG.speed);
    gl.uniform1f(U(mainProg, 'u_turbAmp'), CONFIG.turbAmp);
    gl.uniform1f(U(mainProg, 'u_turbFreq'), CONFIG.turbFreq);
    gl.uniform1f(U(mainProg, 'u_turbIter'), CONFIG.turbIter);
    gl.uniform1f(U(mainProg, 'u_waveFreq'), CONFIG.waveFreq);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}

// bootstrap: SVG inline -> Image -> heightmap -> WebGL
const LOGO_ATIVO = matchMedia('(max-width: 700px)').matches ? LOGO_SVG_V : LOGO_SVG;
const svgBlob = new Blob([LOGO_ATIVO], { type: 'image/svg+xml' });
const svgUrl = URL.createObjectURL(svgBlob);
const img = new Image();
img.onload = () => {
  URL.revokeObjectURL(svgUrl);
  start(buildHeightmap(img));
};
img.onerror = () => fail('Falha ao carregar o SVG do logo.');
img.src = svgUrl;


CONFIG.heightmapPad = 0.08;

const nomeParam = new URLSearchParams(location.search).get('cliente');
if (nomeParam) {
  document.getElementById('cliente-nome').textContent = nomeParam;
  document.querySelectorAll('.nome-cliente-hud').forEach(el => el.textContent = nomeParam);
} else {
  document.querySelectorAll('.nome-cliente-hud').forEach(el => el.textContent = 'Patrícia Gonçalves');
}

</script>
